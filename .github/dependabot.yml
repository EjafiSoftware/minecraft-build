version: 2
updates:
  - package-ecosystem: gradle
    directories:
      - /
      - /smoke-mod
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: 'gradle/actions*'
        update-types: ['version-update:semver-major']
    groups:
      github-actions:
        patterns: ['*']
