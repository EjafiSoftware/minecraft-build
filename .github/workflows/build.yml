name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the convention plugin
        run: ./gradlew build

  smoke-mod:
    uses: ./.github/workflows/mod-gate.yml
    permissions:
      contents: read
      packages: read
    with:
      project-dir: smoke-mod

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, smoke-mod]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish the convention plugin
        run: ./gradlew :convention-plugin:publish
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
