name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build the convention plugin
        run: ./gradlew build

  smoke-mod:
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/mod-gate.yml
    permissions:
      contents: write
      packages: read
    with:
      project-dir: smoke-mod

  smoke-mod-codeql:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/mod-codeql.yml
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      project-dir: smoke-mod

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish the convention plugin
        run: ./gradlew :convention-plugin:publish
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
