name: Mod release

on:
  workflow_call:
    inputs:
      curseforge-project-id:
        type: string
        default: ''
    secrets:
      CURSE_API_TOKEN:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag matches mod_version and is on main
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v version="$GITHUB_REF_NAME" '$0 == "## " version || $0 == "## [" version "]" {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Download the mod jar
        uses: actions/download-artifact@v8
        with:
          name: mod-jar
          path: dist

      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" dist/*.jar --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  curseforge:
    if: inputs.curseforge-project-id != ''
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CURSEFORGE_API: https://minecraft.curseforge.com/api
      CURSE_API_TOKEN: ${{ secrets.CURSE_API_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ inputs.curseforge-project-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the mod jar
        uses: actions/download-artifact@v8
        with:
          name: mod-jar
          path: dist

      - name: Resolve the CurseForge game version IDs
        run: |
          curl -fsS -H "X-Api-Token: $CURSE_API_TOKEN" "$CURSEFORGE_API/game/version-types" > version-types.json
          curl -fsS -H "X-Api-Token: $CURSE_API_TOKEN" "$CURSEFORGE_API/game/versions" > versions.json
          jq -c \
            --arg minecraft "$(sed -n 's/^minecraft_version=//p' gradle.properties)" \
            --slurpfile types version-types.json \
            'def pick($name; f): [.[] | select(.name == $name and f) | .id] | if length == 1 then .[0] else error("CurseForge has \(length) game versions named \($name)") end;
            [$types[0][] | select(.slug | startswith("minecraft-")) | .id] as $minecraftTypes
            | [pick($minecraft; .gameVersionTypeID | IN($minecraftTypes[])), pick("NeoForge"; true), pick("Java 21"; true), pick("Client"; true), pick("Server"; true)]' \
            versions.json > game-versions.json

      - name: Upload the mod jar to CurseForge
        run: |
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > release-notes.md
          jq -n \
            --rawfile changelog release-notes.md \
            --slurpfile gameVersions game-versions.json \
            '{changelog: $changelog, changelogType: "markdown", gameVersions: $gameVersions[0], releaseType: "release"}' > metadata.json
          curl -sS --fail-with-body \
            -H "X-Api-Token: $CURSE_API_TOKEN" \
            -F "metadata=<metadata.json;type=application/json" \
            -F "file=@$(ls dist/*.jar)" \
            "$CURSEFORGE_API/projects/$CURSEFORGE_PROJECT_ID/upload-file"
        env:
          GH_TOKEN: ${{ github.token }}
