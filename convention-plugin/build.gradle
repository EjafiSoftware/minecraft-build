plugins {
    id 'groovy-gradle-plugin'
    id 'maven-publish'
}

group = 'com.ejafi.gradle'

dependencies {
    implementation libs.moddev.plugin
    implementation libs.errorprone.plugin
    implementation libs.spotless.plugin
}

tasks.named('processResources', ProcessResources).configure {
    var versions = [
            errorproneCore    : libs.versions.errorprone.core.get(),
            nullaway          : libs.versions.nullaway.get(),
            palantirJavaFormat: libs.versions.palantir.java.format.get(),
            jspecify          : libs.versions.jspecify.get(),
            junit             : libs.versions.junit.get(),
            assertj           : libs.versions.assertj.get(),
            datafaker         : libs.versions.datafaker.get(),
    ]
    inputs.properties versions
    expand versions
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/EjafiSoftware/minecraft-build'
            credentials(PasswordCredentials)
        }
    }
}
