plugins {
    id 'groovy-gradle-plugin'
    id 'maven-publish'
}

group = 'com.ejafi.gradle'

dependencies {
    implementation libs.moddev.plugin
    implementation libs.errorprone.plugin
    implementation libs.spotless.plugin
}

tasks.named('processResources', ProcessResources).configure {
    var versions = [
            errorproneCore    : libs.errorprone.core.get().version,
            nullaway          : libs.nullaway.get().version,
            palantirJavaFormat: libs.palantir.java.format.get().version,
            jspecify          : libs.jspecify.get().version,
            junit             : libs.junit.bom.get().version,
            assertj           : libs.assertj.get().version,
            datafaker         : libs.datafaker.get().version,
            pmd               : libs.pmd.java.get().version,
    ]
    inputs.properties versions
    filesMatching('**/versions.properties') {
        expand versions
    }
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/EjafiSoftware/minecraft-build'
            credentials(PasswordCredentials)
        }
    }
}
